services:
  neo4j:
    image: neo4j:latest
    container_name: graphrag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
    networks:
      - graphrag-net

  ollama:
    image: ollama/ollama:latest
    container_name: graphrag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - graphrag-net

  # Automatic model downloader on container startup
  model-loader:
    image: curlimages/curl:latest
    container_name: graphrag-model-loader
    depends_on:
      - ollama
    restart: on-failure
    networks:
      - graphrag-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for Ollama to become ready..."
        until curl -s http://ollama:11434/api/tags > /dev/null; do
          sleep 2
        done
        echo "Downloading llama3.2 LLM..."
        curl -X POST http://ollama:11434/api/pull -d '{"name":"llama3.2"}'
        echo "Downloading nomic-embed-text vector embeddings..."
        curl -X POST http://ollama:11434/api/pull -d '{"name":"nomic-embed-text"}'
        echo "Ollama AI models initialized successfully!"

  graphrag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphrag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - GRAPHRAG_API_KEY=srjforsure-company-token-2026
      - RATE_LIMIT_PER_MINUTE=180
    depends_on:
      - neo4j
      - ollama
    volumes:
      - ./backups:/app/backups
      - ./jobs_store.json:/app/jobs_store.json
    networks:
      - graphrag-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: graphrag-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - graphrag-api
    networks:
      - graphrag-net

volumes:
  neo4j_data:
  ollama_models:

networks:
  graphrag-net:
    driver: bridge
