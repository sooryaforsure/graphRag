services:
  neo4j:
    image: neo4j:latest
    container_name: graphrag-neo4j
    ports:
      - "7474:7474" # HTTP UI
      - "7687:7687" # Bolt port
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    networks:
      - graphrag-net

  graphrag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphrag-api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - GRAPHRAG_API_KEY=
      - RATE_LIMIT_PER_MINUTE=60
    depends_on:
      - neo4j
    volumes:
      - ./backups:/app/backups
      - ./jobs_store.json:/app/jobs_store.json
    networks:
      - graphrag-net

volumes:
  neo4j_data:

networks:
  graphrag-net:
    driver: bridge
