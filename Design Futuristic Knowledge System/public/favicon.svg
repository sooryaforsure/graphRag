<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect width="32" height="32" rx="8" fill="url(#gGrad)"/>
  
  <!-- Graph Structure forming 'G' -->
  <circle cx="10" cy="10" r="2.5" fill="#ffffff"/>
  <circle cx="22" cy="10" r="2.5" fill="#ffffff"/>
  <circle cx="10" cy="22" r="2.5" fill="#ffffff"/>
  <circle cx="22" cy="22" r="2.5" fill="#ffffff"/>
  <circle cx="16" cy="16" r="2" fill="#93c5fd"/>

  <!-- Solid Edges -->
  <line x1="10" y1="10" x2="22" y2="10" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="10" x2="10" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="22" x2="22" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="22" x2="22" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="16" x2="16" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Inner Graph Cross Ties -->
  <line x1="10" y1="10" x2="16" y2="16" stroke="#bfdbfe" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="22" y1="22" x2="16" y2="16" stroke="#bfdbfe" stroke-width="1.2" stroke-dasharray="2,2"/>
</svg>

